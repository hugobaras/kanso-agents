# Staging local live-ready (phase 10) — Docker d’abord, OVH ensuite.
# Usage:
#   cp .env.staging.example .env.staging   # remplir MISTRAL_API_KEY + master key
#   docker compose -f infra/docker/compose.yml -f infra/docker/compose.staging.yml --env-file .env.staging up -d --build
#
# DB hôte : 5434 (évite conflit avec compose de base sur 5433)
services:
  inbound-api:
    environment:
      KANSO_ENV: staging
      KANSO_SOFT_CAP_EUR_PER_DAY: ${KANSO_SOFT_CAP_EUR_PER_DAY:-5}
      KANSO_MASTER_KEY: ${KANSO_MASTER_KEY:-local-dev-only-change-me-32chars!}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_BASE_URL: ${MISTRAL_BASE_URL:-https://api.eu.mistral.ai/v1}
      KANSO_MISTRAL_MODEL: ${KANSO_MISTRAL_MODEL:-ministral-8b-latest}
      KANSO_STORAGE_DIR: /data/storage
    volumes:
      - kanso_storage:/data/storage
  document-worker:
    environment:
      KANSO_ENV: staging
      KANSO_MASTER_KEY: ${KANSO_MASTER_KEY:-local-dev-only-change-me-32chars!}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      # 1 = extraction hors-ligne (heuristique) même avec une clé Mistral
      KANSO_D2A_FORCE_MOCK: ${KANSO_D2A_FORCE_MOCK:-0}
      KANSO_WORKER_BOOTSTRAP: "0"
      KANSO_WORKER_POLL: "1"
      KANSO_WORKER_ONCE: "0"
      KANSO_POLL_MS: "2000"
      KANSO_STORAGE_DIR: /data/storage
    volumes:
      - kanso_storage:/data/storage
  db:
    ports:
      - "5434:5432"

volumes:
  kanso_storage:
