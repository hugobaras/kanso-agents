services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kanso
      POSTGRES_PASSWORD: kanso
      POSTGRES_DB: kanso
    ports:
      - "5433:5432"
    volumes:
      - kanso_pg:/var/lib/postgresql/data
      - ../../supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanso -d kanso"]
      interval: 5s
      timeout: 5s
      retries: 10

  inbound-api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "3000:3000"
    environment:
      KANSO_ENV: local
      PORT: "3000"
      DATABASE_URL: postgres://kanso:kanso@db:5432/kanso
      KANSO_MASTER_KEY: local-dev-only-change-me
      KANSO_SESSION_TTL_MINUTES: "30"
    depends_on:
      db:
        condition: service_healthy

  document-worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    environment:
      KANSO_ENV: local
      DATABASE_URL: postgres://kanso:kanso@db:5432/kanso
      KANSO_MASTER_KEY: local-dev-only-change-me
    depends_on:
      db:
        condition: service_healthy

volumes:
  kanso_pg:
