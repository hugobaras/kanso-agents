# HA allégée — 2 instances API derrière un reverse-proxy (P3-04).
# Sessions en Postgres → pas d'affinité sticky requise.
#
#   docker compose -f infra/docker/compose.yml -f infra/docker/compose.ha.yml up -d --scale inbound-api=2
#
# Ou via le service `proxy` (nginx) ci-dessous.

services:
  inbound-api:
    environment:
      KANSO_ENV: ha
    # scale via CLI : --scale inbound-api=2
    deploy:
      replicas: 2

  document-worker:
    environment:
      KANSO_ENV: ha
    deploy:
      replicas: 1

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.ha.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - inbound-api
