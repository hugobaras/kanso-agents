worker_processes 1;
events { worker_connections 1024; }
http {
  upstream kanso_api {
    # Docker DNS : avec --scale inbound-api=2, résoudre plusieurs tâches
    server inbound-api:3000;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://kanso_api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /health {
      proxy_pass http://kanso_api/health;
    }
  }
}
