<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kanso — Portail connecteurs</title>
    <style>
      :root {
        --ink: #142033;
        --muted: #5a6578;
        --paper: #f3efe6;
        --card: #fffdf8;
        --line: rgba(20, 32, 51, 0.12);
        --accent: #2a5a4a;
        --danger: #9b2c2c;
        --ok: #1f6b45;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Source Serif 4", "Iowan Old Style", Georgia, serif;
        color: var(--ink);
        background:
          radial-gradient(ellipse at 10% 0%, #e7dfd0 0%, transparent 45%),
          linear-gradient(160deg, #efe9de, #d8e0e8 70%);
      }
      .wrap { max-width: 40rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
      .brand {
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 0.72rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }
      h1 {
        font-weight: 500;
        font-size: clamp(1.75rem, 4vw, 2.25rem);
        margin: 0.6rem 0 0.35rem;
        line-height: 1.2;
      }
      .sub { color: var(--muted); margin: 0 0 1.75rem; line-height: 1.45; }
      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        padding: 1.25rem;
        margin-bottom: 1rem;
      }
      .panel h2 {
        font-size: 1.05rem;
        font-weight: 600;
        margin: 0 0 0.75rem;
      }
      label {
        display: block;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 0.78rem;
        color: var(--muted);
        margin: 0.65rem 0 0.25rem;
      }
      input, textarea, select, button {
        font: inherit;
        width: 100%;
        padding: 0.55rem 0.65rem;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 2px;
      }
      textarea { min-height: 5rem; resize: vertical; }
      button {
        cursor: pointer;
        background: var(--accent);
        color: #f7f4ee;
        border-color: var(--accent);
        margin-top: 0.85rem;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 0.9rem;
      }
      button.secondary {
        background: transparent;
        color: var(--ink);
        border-color: var(--line);
      }
      button.danger {
        background: transparent;
        color: var(--danger);
        border-color: rgba(155, 44, 44, 0.35);
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .row-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .row-actions button { width: auto; flex: 1; min-width: 7rem; margin-top: 0.5rem; }
      .conn {
        border-top: 1px solid var(--line);
        padding: 1rem 0 0.25rem;
        margin-top: 0.75rem;
      }
      .conn:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
      .conn-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 0.75rem;
      }
      .conn-head strong { font-size: 1rem; }
      .badge {
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 0.72rem;
        padding: 0.2rem 0.45rem;
        border: 1px solid var(--line);
        color: var(--muted);
      }
      .badge.on { color: var(--ok); border-color: rgba(31, 107, 69, 0.35); }
      .badge.off { color: var(--danger); border-color: rgba(155, 44, 44, 0.3); }
      .meta {
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 0.78rem;
        color: var(--muted);
        margin: 0.35rem 0 0.5rem;
        line-height: 1.4;
      }
      .msg {
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 0.82rem;
        margin: 0.75rem 0;
        padding: 0.65rem 0.75rem;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.55);
      }
      .msg.err { border-color: rgba(155, 44, 44, 0.4); color: var(--danger); }
      .hidden { display: none !important; }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1rem;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 0.85rem;
      }
      .topbar button { width: auto; margin: 0; padding: 0.4rem 0.7rem; }
      details { margin-top: 0.5rem; }
      summary {
        cursor: pointer;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 0.8rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">Kanso · Portail client</div>
      <h1>Connecteurs d’alerte</h1>
      <p class="sub">
        Branchez ou révoquez e-mail et Slack. Pour Teams, WhatsApp ou autre,
        déposez une demande sur-mesure.
      </p>

      <div id="msg" class="msg hidden"></div>

      <section id="login" class="panel">
        <h2>Connexion</h2>
        <p class="meta">Magic link envoyé à l’e-mail invité (console en local).</p>
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="username" placeholder="vous@cabinet.fr" />
        <label for="tenant">Tenant (si plusieurs cabinets)</label>
        <input id="tenant" type="text" placeholder="optionnel — ex. cabinet-durand" />
        <button id="btn-login" type="button">Recevoir le lien</button>
      </section>

      <section id="app" class="hidden">
        <div class="topbar">
          <div>
            <strong id="who"></strong>
            <div class="meta" id="tenant-label" style="margin:0"></div>
          </div>
          <button id="btn-logout" class="secondary" type="button">Déconnexion</button>
        </div>

        <div class="panel">
          <h2>Canaux</h2>
          <div id="connectors"></div>
        </div>

        <div class="panel">
          <h2>Sur-mesure</h2>
          <p class="meta">Pas d’intégration inventée — une demande ops structurée.</p>
          <label for="platform">Plateforme</label>
          <input id="platform" placeholder="ex. Microsoft Teams" />
          <label for="ctitle">Titre</label>
          <input id="ctitle" placeholder="Alertes hot leads vers Teams" />
          <label for="cdesc">Description</label>
          <textarea id="cdesc" placeholder="Canal, fréquence, contraintes…"></textarea>
          <button id="btn-custom" type="button">Envoyer la demande</button>
          <div id="custom-list" class="meta" style="margin-top:1rem"></div>
        </div>
      </section>
    </div>

    <script>
      const TOKEN_KEY = "kanso_portal_session";
      const $ = (id) => document.getElementById(id);
      const api = (path, opts = {}) => {
        const headers = { "content-type": "application/json", ...(opts.headers || {}) };
        const t = localStorage.getItem(TOKEN_KEY);
        if (t) headers.authorization = "Bearer " + t;
        return fetch(path, { ...opts, headers }).then(async (r) => {
          const data = await r.json().catch(() => ({}));
          if (!r.ok) throw Object.assign(new Error(data.error || r.statusText), { data, status: r.status });
          return data;
        });
      };

      function showMsg(text, err) {
        const el = $("msg");
        el.textContent = text;
        el.classList.remove("hidden");
        el.classList.toggle("err", !!err);
      }
      function clearMsg() {
        $("msg").classList.add("hidden");
      }

      async function consumeHashToken() {
        const hash = location.hash.replace(/^#/, "");
        const params = new URLSearchParams(hash);
        const token = params.get("token");
        if (!token) return;
        history.replaceState(null, "", location.pathname);
        const data = await api("/portal/api/auth/consume", {
          method: "POST",
          body: JSON.stringify({ token }),
        });
        localStorage.setItem(TOKEN_KEY, data.session_token);
        showMsg("Connecté.");
      }

      function badge(conn) {
        if (!conn.connected) return '<span class="badge">Non branché</span>';
        if (conn.enabled) return '<span class="badge on">Actif</span>';
        return '<span class="badge off">Désactivé</span>';
      }

      function renderConnectors(list) {
        const root = $("connectors");
        root.innerHTML = "";
        for (const conn of list) {
          if (conn.type === "custom") continue;
          const div = document.createElement("div");
          div.className = "conn";
          const hints =
            conn.type === "email" && conn.hints
              ? `→ ${conn.hints.to || "?"}${conn.hints.host ? " · SMTP " + conn.hints.host : " · console"}`
              : conn.type === "slack" && conn.hints
                ? conn.hints.webhook_masked
                : "";
          div.innerHTML = `
            <div class="conn-head">
              <strong>${conn.label}</strong>
              ${badge(conn)}
            </div>
            <div class="meta">${hints || "Aucun secret enregistré"}</div>
            <div class="form" data-type="${conn.type}"></div>
            <div class="row-actions" data-actions="${conn.type}"></div>
          `;
          const form = div.querySelector(".form");
          const actions = div.querySelector(".row-actions");
          if (conn.type === "email") {
            form.innerHTML = `
              <details ${conn.connected ? "" : "open"}>
                <summary>${conn.connected ? "Modifier" : "Brancher"} e-mail</summary>
                <label>Destinataire</label>
                <input data-f="to" value="${conn.hints?.to || ""}" placeholder="ops@cabinet.fr" />
                <label>From (optionnel)</label>
                <input data-f="from" value="${conn.hints?.from || ""}" />
                <label>SMTP host (optionnel — sinon console)</label>
                <input data-f="host" value="${conn.hints?.host || ""}" placeholder="ssl0.ovh.net" />
                <label>Port / user / pass (si SMTP)</label>
                <input data-f="port" value="587" placeholder="587" />
                <input data-f="user" placeholder="user SMTP" />
                <input data-f="pass" type="password" placeholder="mot de passe SMTP" />
                <button type="button" data-save="email">Enregistrer</button>
              </details>
            `;
          } else {
            form.innerHTML = `
              <details ${conn.connected ? "" : "open"}>
                <summary>${conn.connected ? "Modifier" : "Brancher"} Slack webhook</summary>
                <label>Incoming Webhook URL</label>
                <input data-f="webhook_url" placeholder="https://hooks.slack.com/services/…" />
                <button type="button" data-save="slack">Enregistrer</button>
              </details>
            `;
          }
          if (conn.connected) {
            actions.innerHTML = `
              <button type="button" class="secondary" data-toggle="${conn.type}" data-enabled="${conn.enabled ? "0" : "1"}">
                ${conn.enabled ? "Désactiver" : "Réactiver"}
              </button>
              <button type="button" class="danger" data-revoke="${conn.type}">Révoquer</button>
            `;
          }
          root.appendChild(div);
        }
      }

      async function loadApp() {
        const me = await api("/portal/api/me");
        $("login").classList.add("hidden");
        $("app").classList.remove("hidden");
        $("who").textContent = me.user.email;
        $("tenant-label").textContent =
          me.user.display_name + " · " + me.user.tenant_id;
        const cons = await api("/portal/api/connectors");
        renderConnectors(cons.connectors);
        const customs = await api("/portal/api/custom-requests");
        $("custom-list").innerHTML = (customs.requests || [])
          .map(
            (r) =>
              `<div>• [${r.status}] ${r.platform} — ${r.title}</div>`,
          )
          .join("") || "Aucune demande pour l’instant.";
      }

      $("btn-login").onclick = async () => {
        clearMsg();
        try {
          const body = { email: $("email").value.trim() };
          const t = $("tenant").value.trim();
          if (t) body.tenant_id = t;
          const data = await api("/portal/api/auth/request", {
            method: "POST",
            body: JSON.stringify(body),
          });
          if (data.token) {
            const consumed = await api("/portal/api/auth/consume", {
              method: "POST",
              body: JSON.stringify({ token: data.token }),
            });
            localStorage.setItem(TOKEN_KEY, consumed.session_token);
            await loadApp();
            showMsg("Connecté (mode local — lien auto).");
          } else {
            showMsg(data.message || "Lien envoyé si le compte existe.");
          }
        } catch (e) {
          showMsg(e.data?.hint || e.message, true);
        }
      };

      $("btn-logout").onclick = async () => {
        try {
          await api("/portal/api/auth/logout", { method: "POST" });
        } catch (_) {}
        localStorage.removeItem(TOKEN_KEY);
        location.reload();
      };

      $("connectors").addEventListener("click", async (ev) => {
        const t = ev.target;
        if (!(t instanceof HTMLElement)) return;
        clearMsg();
        try {
          if (t.dataset.save === "email") {
            const box = t.closest(".form");
            const g = (f) => box.querySelector(`[data-f="${f}"]`)?.value?.trim();
            await api("/portal/api/connectors/email", {
              method: "PUT",
              body: JSON.stringify({
                to: g("to"),
                from: g("from") || undefined,
                host: g("host") || undefined,
                port: g("port") || undefined,
                user: g("user") || undefined,
                pass: g("pass") || undefined,
              }),
            });
            showMsg("E-mail connecté.");
            await loadApp();
          }
          if (t.dataset.save === "slack") {
            const box = t.closest(".form");
            const url = box.querySelector('[data-f="webhook_url"]')?.value?.trim();
            await api("/portal/api/connectors/slack", {
              method: "PUT",
              body: JSON.stringify({ webhook_url: url }),
            });
            showMsg("Slack connecté.");
            await loadApp();
          }
          if (t.dataset.revoke) {
            if (!confirm("Révoquer ce connecteur ?")) return;
            await api("/portal/api/connectors/" + t.dataset.revoke, {
              method: "DELETE",
            });
            showMsg("Révoqué.");
            await loadApp();
          }
          if (t.dataset.toggle) {
            await api(
              "/portal/api/connectors/" + t.dataset.toggle + "/enable",
              {
                method: "POST",
                body: JSON.stringify({
                  enabled: t.dataset.enabled === "1",
                }),
              },
            );
            await loadApp();
          }
        } catch (e) {
          showMsg(e.data?.hint || e.message, true);
        }
      });

      $("btn-custom").onclick = async () => {
        clearMsg();
        try {
          await api("/portal/api/custom-requests", {
            method: "POST",
            body: JSON.stringify({
              platform: $("platform").value.trim(),
              title: $("ctitle").value.trim(),
              description: $("cdesc").value.trim(),
            }),
          });
          $("platform").value = "";
          $("ctitle").value = "";
          $("cdesc").value = "";
          showMsg("Demande envoyée.");
          await loadApp();
        } catch (e) {
          showMsg(e.data?.hint || e.message, true);
        }
      };

      (async () => {
        try {
          await consumeHashToken();
          if (localStorage.getItem(TOKEN_KEY)) await loadApp();
        } catch (e) {
          localStorage.removeItem(TOKEN_KEY);
          showMsg(e.message || "Session invalide", true);
        }
      })();
    </script>
  </body>
</html>
