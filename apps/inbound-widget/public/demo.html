<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kanso widget demo</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Georgia, serif;
        background: linear-gradient(160deg, #e8e2d6, #f7f4ef 45%, #d9e2e8);
        color: #1a1a1a;
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 4rem 1.5rem;
      }
      h1 { font-weight: 500; font-size: 2.4rem; margin: 0 0 .5rem; }
      p { line-height: 1.5; opacity: .85; }
    </style>
  </head>
  <body>
    <main>
      <h1>Site client (démo)</h1>
      <p>
        Le widget Kanso s’ouvre en bas à droite. Le premier message affiche le
        disclaimer IA servi par l’API.
      </p>
    </main>
    <script
      src="/widget/kanso-widget.js"
      data-tenant="demo-tenant"
      data-api="http://127.0.0.1:3000"
      data-primary-color="#1B2A4A"
      data-title="Cabinet Durand"
    ></script>
  </body>
</html>
