<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kanso — Embed preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #121820;
        --muted: #66707c;
        --bg: #f2f3f5;
        --card: #fff;
        --line: rgba(18, 24, 32, 0.09);
        --accent: #1a2740;
        --radius: 1.1rem;
        --font: "Sora", ui-sans-serif, system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--font);
        color: var(--ink);
        background: var(--bg);
      }
      .wrap { max-width: 44rem; margin: 0 auto; padding: 2rem 1.15rem 6rem; }
      .brand {
        display: inline-block;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
        background: #e8ebf0;
        border-radius: 999px;
        padding: 0.35rem 0.75rem;
      }
      h1 {
        font-family: "Fraunces", Georgia, serif;
        font-size: clamp(1.7rem, 4vw, 2.2rem);
        font-weight: 600;
        margin: 0.85rem 0 0.4rem;
      }
      .sub { color: var(--muted); line-height: 1.5; margin: 0 0 1.25rem; }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 1.2rem;
        margin-bottom: 1rem;
      }
      label {
        display: block;
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--muted);
        margin: 0.65rem 0 0.3rem;
      }
      input, button, textarea {
        font: inherit;
        width: 100%;
        padding: 0.7rem 0.9rem;
        border: 1px solid var(--line);
        border-radius: 0.75rem;
        background: #fff;
      }
      textarea {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.78rem;
        min-height: 7rem;
        resize: vertical;
      }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
      @media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
      button {
        margin-top: 0.85rem;
        background: var(--accent);
        color: #f5f6f8;
        border: none;
        border-radius: 999px;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary {
        background: #fff;
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
      .actions button { width: auto; flex: 1; min-width: 8rem; }
      .hint { font-size: 0.78rem; color: var(--muted); margin-top: 0.5rem; line-height: 1.4; }
      .ok { color: #3451a1; }
      .err { color: #b42318; }
      .site-fake {
        border-radius: var(--radius);
        border: 1px dashed var(--line);
        padding: 1.5rem;
        min-height: 12rem;
        background: #fafafa;
      }
      .site-fake h2 {
        font-family: "Fraunces", Georgia, serif;
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">Kanso · Kit embed</div>
      <h1>Prévisualisation widget</h1>
      <p class="sub">
        Testez le snippet avant de le coller sur le site partenaire.
        CORS : définir <code>KANSO_CORS_ORIGINS</code> avec l’origine du site.
      </p>

      <div class="card">
        <div class="row">
          <div>
            <label for="tenant">Tenant</label>
            <input id="tenant" value="demo-tenant" />
          </div>
          <div>
            <label for="color">Couleur</label>
            <input id="color" value="#1a2740" />
          </div>
        </div>
        <label for="api">API base</label>
        <input id="api" />
        <div class="actions">
          <button type="button" id="btn-load">Charger le widget</button>
          <button type="button" class="secondary" id="btn-copy">Copier le snippet</button>
        </div>
        <p class="hint" id="status"></p>
      </div>

      <div class="card">
        <label>Snippet</label>
        <textarea id="snippet" readonly></textarea>
      </div>

      <div class="card site-fake">
        <h2>Page partenaire (simulée)</h2>
        <p class="hint">Le widget apparaît en bas à droite après chargement.</p>
        <div id="mount"></div>
      </div>
    </div>
    <script>
      const $ = (id) => document.getElementById(id);
      const defaultApi = location.origin;
      $("api").value = defaultApi;

      function buildSnippet() {
        const tenant = $("tenant").value.trim() || "demo-tenant";
        const api = ($("api").value.trim() || defaultApi).replace(/\/$/, "");
        const color = $("color").value.trim() || "#1a2740";
        return `<!-- Kanso Inbound -->
<script
  src="${api}/widget/kanso-widget.js"
  data-tenant="${tenant}"
  data-api="${api}"
  data-primary-color="${color}"
><\/script>`;
      }

      function refreshSnippet() {
        $("snippet").value = buildSnippet();
      }

      $("btn-load").onclick = () => {
        $("status").textContent = "";
        $("status").className = "hint";
        document.querySelectorAll('script[data-kanso-embed]').forEach((s) => s.remove());
        const existing = document.getElementById("kanso-root");
        if (existing) existing.remove();
        refreshSnippet();
        const s = document.createElement("script");
        s.src = ($("api").value.trim() || defaultApi).replace(/\/$/, "") +
          "/widget/kanso-widget.js?t=" + Date.now();
        s.dataset.tenant = $("tenant").value.trim();
        s.dataset.api = ($("api").value.trim() || defaultApi).replace(/\/$/, "");
        s.dataset.primaryColor = $("color").value.trim();
        s.dataset.kansoEmbed = "1";
        s.onload = () => {
          $("status").textContent = "Widget chargé.";
          $("status").className = "hint ok";
        };
        s.onerror = () => {
          $("status").textContent = "Échec chargement script widget.";
          $("status").className = "hint err";
        };
        document.body.appendChild(s);
      };

      $("btn-copy").onclick = async () => {
        refreshSnippet();
        try {
          await navigator.clipboard.writeText($("snippet").value);
          $("status").textContent = "Snippet copié.";
          $("status").className = "hint ok";
        } catch {
          $("status").textContent = "Sélectionnez le textarea et copiez (⌘C).";
        }
      };

      ["tenant", "api", "color"].forEach((id) => {
        $(id).addEventListener("input", refreshSnippet);
      });

      const params = new URLSearchParams(location.search);
      if (params.get("tenant")) $("tenant").value = params.get("tenant");
      if (params.get("color")) $("color").value = params.get("color");
      if (params.get("api")) $("api").value = params.get("api");
      refreshSnippet();
    </script>
  </body>
</html>
