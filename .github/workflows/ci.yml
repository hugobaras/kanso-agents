name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kanso
          POSTGRES_PASSWORD: kanso
          POSTGRES_DB: kanso
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kanso -d kanso"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://kanso:kanso@localhost:5432/kanso
      KANSO_MASTER_KEY: ci-only-master-key-at-least-32-chars!!
      KANSO_RATE_LIMIT: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm install --frozen-lockfile
      - name: Migrations (twice: must be idempotent)
        run: sh scripts/apply-migrations.sh && sh scripts/apply-migrations.sh
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm eval:inbound
      - run: pnpm eval:documents
      - run: pnpm eval:corpus

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images (api, worker, web)
        run: |
          for t in api worker web; do
            docker build -f infra/docker/Dockerfile --target "$t" -t "kanso-$t:ci" .
          done
